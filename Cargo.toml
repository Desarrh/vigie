[package]
name = "vigie"
version = "0.1.0"
edition = "2024"
description = "Lightweight Windows task manager with a ghost-RAM hunter"
license = "MIT"

[dependencies]
egui = "0.37.0"
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard", "links"] }
winit = "0.30.13"
softbuffer = "0.4.8"
hdrshot-egui-backend = "0.2.0"
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
socle = { git = "https://github.com/Desarrh/socle", tag = "v0.1.6", default-features = false, features = ["ui", "settings", "crash", "instance", "testmode"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Performance",
  "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_System_RemoteDesktop", "Win32_System_Environment",
] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
